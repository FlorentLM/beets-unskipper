[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-unskipper"
version = "1.0.0"
description = "Beets plugin to browse and edit the import state file (state.pickle) with a small TUI"
authors = [
    {name = "Florent Le Moël", email = "25004801+FlorentLM@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
keywords = ["beets", "beetsplug", "music", "import", "tui", "skipped"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "beets>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/FlorentLM/beets-unskipper"
Issues = "https://github.com/FlorentLM/beets-unskipper/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]
